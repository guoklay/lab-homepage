name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm run install:all

      - name: 后端语法检查
        run: |
          for f in $(find server/src -name '*.js'); do
            node --check "$f" || exit 1
          done

      - name: 前端构建
        run: npm run build
